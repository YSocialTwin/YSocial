# docker compose -f docker/compose.yml up                     -> YSocial + SQLite
# docker compose -f docker/compose.yml --profile postgres up  -> + PostgreSQL
# LLM servers (Ollama/vLLM/OpenAI-compatible) run outside the stack:
# set the endpoint from the YSocial admin UI (e.g. http://host.docker.internal:11434).
services:
  ysocial:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        WITH_TOXICITY: ${WITH_TOXICITY:-0}
    image: ysocial:latest
    ports:
      - "${YSOCIAL_PORT:-5000}:5000"
    volumes:
      - ysocial-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ysocial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ysocial}
      POSTGRES_DB: ${POSTGRES_DB:-ysocial}
    volumes:
      - ysocial-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ysocial-data:
  ysocial-pg:
