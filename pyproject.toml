[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | external
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["external/*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ysocial"
dynamic = ["version", "dependencies"]
description = "YSocial: a digital twin of social media platforms populated by LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Giulio Rossetti" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
]

[project.scripts]
ysocial = "y_social:main"

[tool.setuptools]
py-modules = ["y_social"]
include-package-data = false

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
dependencies = { file = ["requirements/base.in"] }

[tool.setuptools.packages.find]
include = ["y_web*", "data_schema*"]
exclude = [
    "y_web.tests*",
    "y_web.experiments*",
    "y_web.db",
    "y_web.db.*",
    "y_web.static*",
    "y_web.templates*",
    "y_web.translations*",
]
namespaces = true

[tool.setuptools.package-data]
y_web = [
    "templates/**/*",
    "static/**/*",
    "translations/**/*",
    "alembic/script.py.mako",
    "alembic/README",
    "prompts_internal*.json",
    "src/system/sample_notebook/*",
    "migrations/README.md",
]
data_schema = ["*.db", "*.sql", "prompts/**/*", "migrations/**/*"]
