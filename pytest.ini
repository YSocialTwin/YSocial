[pytest]
testpaths = y_web/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# a test that hangs fails after 5 minutes instead of blocking the run (needs pytest-timeout; ignored without it)
timeout = 300
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    external_repo: tests requiring external plugin repositories under external/
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
    error::sqlalchemy.exc.MovedIn20Warning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
