<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .page { fill:#f4f5f7; }
    .topbar { fill:#ffffff; stroke:#dfe2e6; stroke-width:1; }
    .title { fill:#1b1f24; font-size:18px; font-weight:bold; }
    .subtitle { fill:#6b7280; font-size:11px; }
    .panel { fill:#ffffff; stroke:#dfe2e6; stroke-width:1; }
    .panel-title { fill:#374151; font-size:12px; font-weight:bold; }
    .thread-item { fill:#f4f6fb; }
    .thread-item-active { fill:#e4edff; }
    .thread-text { fill:#374151; font-size:11px; }
    .thread-text-active { fill:#2651c7; font-size:11px; font-weight:bold; }
    .node-card { fill:#ffffff; stroke:#dfe2e6; stroke-width:1; }
    .node-card-root { stroke:#3a6df0; stroke-width:1.5; }
    .author { fill:#1b1f24; font-size:12px; font-weight:bold; }
    .content { fill:#374151; font-size:11px; }
    .badge-manual { fill:#eef1f6; }
    .badge-manual-t { fill:#4b5563; font-size:9px; font-weight:bold; }
    .badge-llm { fill:#f1e9ff; }
    .badge-llm-t { fill:#6b3fd4; font-size:9px; font-weight:bold; }
    .badge-approved { fill:#e2f7e8; }
    .badge-approved-t { fill:#1b7a3b; font-size:9px; font-weight:bold; }
    .icon-btn { fill:#f4f6fb; stroke:#dfe2e6; }
    .icon-btn-t { fill:#6b7280; font-size:9px; }
    .connector { stroke:#d7dce3; stroke-width:1.5; fill:none; }
    .field { fill:#f9fafb; stroke:#d7dce3; stroke-width:1; }
    .field-text { fill:#6b7280; font-size:11px; }
    .label { fill:#374151; font-size:11px; font-weight:bold; }
    .btn-primary { fill:#3a6df0; }
    .btn-primary-text { fill:#ffffff; font-size:11px; font-weight:bold; }
    .btn-ghost { fill:#ffffff; stroke:#d7dce3; }
    .btn-ghost-text { fill:#374151; font-size:11px; }
    .status-pill { fill:#fff6d6; }
    .status-pill-t { fill:#8a6d00; font-size:10px; font-weight:bold; }
  </style>

  <rect class="page" x="0" y="0" width="960" height="620"/>

  <!-- Topbar -->
  <rect class="topbar" x="0" y="0" width="960" height="54"/>
  <text class="title" x="24" y="24">Scenario Design — "Dibattito su policy clima"</text>
  <text class="subtitle" x="24" y="42">exp_017 · HPC · ultima modifica 2 minuti fa · autosave attivo</text>
  <rect class="status-pill" x="700" y="14" width="86" height="24" rx="12"/>
  <text class="status-pill-t" x="716" y="30">draft</text>
  <rect class="btn-ghost" x="796" y="14" width="76" height="26" rx="6"/>
  <text class="btn-ghost-text" x="810" y="31">Valida</text>
  <rect class="btn-primary" x="878" y="14" width="66" height="26" rx="6"/>
  <text class="btn-primary-text" x="892" y="31">Salva</text>

  <!-- Thread list sidebar -->
  <rect class="panel" x="14" y="68" width="190" height="538" rx="8"/>
  <text class="panel-title" x="28" y="92">THREAD (3)</text>
  <rect class="thread-item-active" x="24" y="104" width="170" height="40" rx="6"/>
  <text class="thread-text-active" x="34" y="120">Carbon tax: pro</text>
  <text class="thread-text-active" x="34" y="134">5 nodi · ✓ valido</text>

  <rect class="thread-item" x="24" y="150" width="170" height="40" rx="6"/>
  <text class="thread-text" x="34" y="166">Carbon tax: contro</text>
  <text class="thread-text" x="34" y="180">4 nodi · ⚠ 1 avviso</text>

  <rect class="thread-item" x="24" y="196" width="170" height="40" rx="6"/>
  <text class="thread-text" x="34" y="212">Impatto su lavoratori</text>
  <text class="thread-text" x="34" y="226">2 nodi · ✓ valido</text>

  <rect class="btn-ghost" x="24" y="250" width="170" height="30" rx="6"/>
  <text class="btn-ghost-text" x="60" y="269">+ Nuovo thread</text>

  <!-- Tree editor -->
  <rect class="panel" x="214" y="68" width="470" height="538" rx="8"/>
  <text class="panel-title" x="228" y="92">ALBERO THREAD — Carbon tax: pro</text>

  <!-- Root node -->
  <rect class="node-card node-card-root" x="228" y="104" width="300" height="60" rx="6"/>
  <text class="author" x="240" y="122">@climate_voice_12 (agente)</text>
  <text class="content" x="240" y="138">"Una carbon tax ben progettata riduce le</text>
  <text class="content" x="240" y="152">emissioni senza frenare la crescita."</text>
  <rect class="badge-approved" x="470" y="110" width="48" height="16" rx="8"/>
  <text class="badge-approved-t" x="478" y="122">OK</text>

  <path class="connector" d="M248 164 v18 h40 v10"/>

  <!-- Reply 1 -->
  <rect class="node-card" x="268" y="192" width="300" height="60" rx="6"/>
  <text class="author" x="280" y="210">@skeptic_07 (ruolo ad hoc: scettico)</text>
  <text class="content" x="280" y="226">"I dati storici non confermano questo</text>
  <text class="content" x="280" y="240">effetto nella maggior parte dei paesi."</text>
  <rect class="badge-llm" x="516" y="198" width="60" height="16" rx="8"/>
  <text class="badge-llm-t" x="524" y="210">BOZZA LLM</text>

  <path class="connector" d="M288 252 v18 h40 v10"/>

  <!-- Reply 2 (nested) -->
  <rect class="node-card" x="308" y="280" width="300" height="60" rx="6"/>
  <text class="author" x="320" y="298">@climate_voice_12 (agente)</text>
  <text class="content" x="320" y="314">"In Svezia le emissioni sono calate del</text>
  <text class="content" x="320" y="328">26% dall'introduzione della carbon tax."</text>
  <rect class="badge-manual" x="556" y="286" width="62" height="16" rx="8"/>
  <text class="badge-manual-t" x="564" y="298">MANUALE</text>

  <!-- Inline actions row for reply 2 -->
  <rect class="icon-btn" x="308" y="346" width="54" height="22" rx="5"/>
  <text class="icon-btn-t" x="316" y="361">Modifica</text>
  <rect class="icon-btn" x="366" y="346" width="58" height="22" rx="5"/>
  <text class="icon-btn-t" x="374" y="361">Rigenera</text>
  <rect class="icon-btn" x="428" y="346" width="78" height="22" rx="5"/>
  <text class="icon-btn-t" x="436" y="361">+ Risposta</text>
  <rect class="icon-btn" x="510" y="346" width="52" height="22" rx="5"/>
  <text class="icon-btn-t" x="518" y="361">Elimina</text>

  <text class="panel-title" x="228" y="400" fill="#9aa3af" font-weight="normal">(ulteriori nodi del thread, scorrimento verticale)</text>

  <!-- Right panel: generation + metadata -->
  <rect class="panel" x="696" y="68" width="250" height="538" rx="8"/>
  <text class="panel-title" x="710" y="92">NODO SELEZIONATO</text>

  <text class="label" x="710" y="116">Autore</text>
  <rect class="field" x="710" y="124" width="222" height="30" rx="6"/>
  <text class="field-text" x="722" y="143">@skeptic_07 (type-ahead utenti)</text>

  <text class="label" x="710" y="172">Ruolo ad hoc</text>
  <rect class="field" x="710" y="180" width="222" height="30" rx="6"/>
  <text class="field-text" x="722" y="199">Scettico climatico ▾</text>
  <text class="subtitle" x="710" y="220">da y_agents_plugins — se assente:</text>
  <text class="subtitle" x="710" y="232">fallback "Standard" (§17)</text>

  <text class="label" x="710" y="256">Modello LLM</text>
  <rect class="field" x="710" y="264" width="222" height="30" rx="6"/>
  <text class="field-text" x="722" y="283">gpt-4o-mini @ endpoint-01</text>
  <rect class="btn-ghost" x="710" y="300" width="100" height="24" rx="6"/>
  <text class="btn-ghost-text" x="722" y="316">Fetch Models</text>

  <rect class="btn-primary" x="818" y="300" width="114" height="24" rx="6"/>
  <text class="btn-primary-text" x="830" y="316">✨ Genera bozza</text>

  <text class="label" x="710" y="350">Metadati (opzionali)</text>
  <rect class="field" x="710" y="358" width="105" height="26" rx="6"/>
  <text class="field-text" x="718" y="375">Sentiment ▾</text>
  <rect class="field" x="827" y="358" width="105" height="26" rx="6"/>
  <text class="field-text" x="835" y="375">Topic ▾</text>
  <rect class="field" x="710" y="390" width="105" height="26" rx="6"/>
  <text class="field-text" x="718" y="407">Emozione ▾</text>
  <rect class="field" x="827" y="390" width="105" height="26" rx="6"/>
  <text class="field-text" x="835" y="407">Tossicità ▾</text>

  <text class="label" x="710" y="440">Confronto bozza</text>
  <rect class="field" x="710" y="448" width="222" height="80" rx="6"/>
  <text class="field-text" x="722" y="466">Precedente: "I dati non sono</text>
  <text class="field-text" x="722" y="480">chiari su questo effetto."</text>
  <text class="field-text" x="722" y="500">Nuova: "I dati storici non</text>
  <text class="field-text" x="722" y="514">confermano questo effetto…"</text>

  <rect class="btn-ghost" x="710" y="540" width="105" height="26" rx="6"/>
  <text class="btn-ghost-text" x="730" y="557">Annulla</text>
  <rect class="btn-primary" x="827" y="540" width="105" height="26" rx="6"/>
  <text class="btn-primary-text" x="844" y="557">Sostituisci</text>

  <text x="710" y="594" fill="#9aa3af" font-size="10" font-style="italic">Wireframe illustrativo — non design finale [P]</text>
</svg>
