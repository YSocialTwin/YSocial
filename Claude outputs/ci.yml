name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install flake8
      # Critical-only selection (syntax errors, undefined names, and
      # similarly real defects) -- a deliberate scope decision
      # (docs/decisions.md), not a full style gate: this repo accumulated
      # style choices across nine implementation phases that this CI
      # addition is not meant to retroactively enforce.
      - run: flake8 --select=E9,F63,F7,F82 modules tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install flask pytest
      # This repo's own standalone suite only (pure logic, no YWeb/db
      # dependency) -- the YWeb-core integration suite
      # (y_web/tests/test_scenario_design_fase*.py) needs a full YWeb
      # checkout and runs from YWeb core's own CI instead; see
      # docs/decisions.md for why the two suites are kept separate.
      - run: pytest tests/ -q
