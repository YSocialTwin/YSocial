<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .page { fill:#f4f5f7; }
    .topbar { fill:#ffffff; stroke:#dfe2e6; stroke-width:1; }
    .title { fill:#1b1f24; font-size:18px; font-weight:bold; }
    .subtitle { fill:#6b7280; font-size:11px; }
    .panel { fill:#ffffff; stroke:#dfe2e6; stroke-width:1; }
    .panel-title { fill:#374151; font-size:13px; font-weight:bold; }
    .ok-row { fill:#e2f7e8; }
    .ok-icon { fill:#1b7a3b; }
    .ok-text { fill:#14532d; font-size:12px; }
    .warn-row { fill:#fff6d6; }
    .warn-icon { fill:#8a6d00; }
    .warn-text { fill:#6b5300; font-size:12px; }
    .stat-card { fill:#f9fafb; stroke:#eef0f3; stroke-width:1; }
    .stat-num { fill:#1b1f24; font-size:22px; font-weight:bold; }
    .stat-label { fill:#6b7280; font-size:11px; }
    .badge-hpc { fill:#fdeee0; stroke:#f6c69a; }
    .badge-hpc-text { fill:#b2590a; font-size:10px; font-weight:bold; }
    .checkbox { fill:#ffffff; stroke:#9aa3af; stroke-width:1.5; }
    .check-mark { stroke:#3a6df0; stroke-width:2; fill:none; }
    .label { fill:#374151; font-size:12px; }
    .btn-primary { fill:#3a6df0; }
    .btn-primary-disabled { fill:#c7d2fe; }
    .btn-primary-text { fill:#ffffff; font-size:12px; font-weight:bold; }
    .btn-ghost { fill:#ffffff; stroke:#d7dce3; }
    .btn-ghost-text { fill:#374151; font-size:12px; }
  </style>

  <rect class="page" x="0" y="0" width="960" height="560"/>

  <rect class="topbar" x="0" y="0" width="960" height="54"/>
  <text class="title" x="24" y="24">Pubblica scenario — "Dibattito su policy clima"</text>
  <text class="subtitle" x="24" y="42">Validazione pre-pubblicazione · target: exp_017 (HPC)</text>
  <rect class="badge-hpc" x="800" y="16" width="48" height="22" rx="11"/>
  <text class="badge-hpc-text" x="810" y="31">HPC</text>

  <!-- Validation panel -->
  <rect class="panel" x="24" y="72" width="420" height="300" rx="8"/>
  <text class="panel-title" x="40" y="98">Esiti validazione (invarianti §13)</text>

  <rect class="ok-row" x="40" y="112" width="388" height="32" rx="6"/>
  <circle class="ok-icon" cx="58" cy="128" r="7"/>
  <text class="ok-text" x="74" y="133">3 thread, nessun nodo orfano, nessun ciclo</text>

  <rect class="ok-row" x="40" y="150" width="388" height="32" rx="6"/>
  <circle class="ok-icon" cx="58" cy="166" r="7"/>
  <text class="ok-text" x="74" y="171">Tutti gli autori esistono ancora nell'esperimento</text>

  <rect class="warn-row" x="40" y="188" width="388" height="32" rx="6"/>
  <circle class="warn-icon" cx="58" cy="204" r="7"/>
  <text class="warn-text" x="74" y="209">1 nodo con bozza LLM non ancora approvata</text>

  <rect class="ok-row" x="40" y="226" width="388" height="32" rx="6"/>
  <circle class="ok-icon" cx="58" cy="242" r="7"/>
  <text class="ok-text" x="74" y="247">Fingerprint esperimento invariato dalla creazione</text>

  <text class="label" x="40" y="286">Un nodo con bozza LLM non approvata blocca</text>
  <text class="label" x="40" y="302">la pubblicazione (mai auto-pubblicato, §16).</text>

  <rect class="checkbox" x="40" y="320" width="16" height="16" rx="3"/>
  <text class="label" x="64" y="333">Ho verificato gli avvisi sopra riportati</text>

  <!-- Preview panel -->
  <rect class="panel" x="464" y="72" width="472" height="300" rx="8"/>
  <text class="panel-title" x="480" y="98">Anteprima operazioni su db_exp (exp_017)</text>

  <rect class="stat-card" x="480" y="112" width="100" height="70" rx="6"/>
  <text class="stat-num" x="512" y="150">3</text>
  <text class="stat-label" x="494" y="168">thread radice</text>

  <rect class="stat-card" x="588" y="112" width="100" height="70" rx="6"/>
  <text class="stat-num" x="612" y="150">11</text>
  <text class="stat-label" x="498" y="168" dx="114">post/commenti</text>

  <rect class="stat-card" x="696" y="112" width="100" height="70" rx="6"/>
  <text class="stat-num" x="722" y="150">9</text>
  <text class="stat-label" x="710" y="168">metadati</text>

  <rect class="stat-card" x="804" y="112" width="116" height="70" rx="6"/>
  <text class="stat-num" x="840" y="150">0</text>
  <text class="stat-label" x="814" y="168">utenti nuovi</text>

  <text class="label" x="480" y="206">Nessuna sostituzione di thread esistenti (§20).</text>
  <text class="label" x="480" y="224">Transazione unica sul bind db_exp (§11, §18).</text>
  <text class="label" x="480" y="242">Rollback automatico su qualunque errore: nessuna</text>
  <text class="label" x="480" y="258">riga orfana, stato scenario resta "validated".</text>

  <text class="panel-title" x="480" y="296">Dopo la pubblicazione</text>
  <text class="label" x="480" y="316">Lo scenario diventa di sola lettura (storico),</text>
  <text class="label" x="480" y="332">con link diretto alla simulazione materializzata.</text>

  <!-- Footer -->
  <rect class="btn-ghost" x="700" y="396" width="110" height="34" rx="6"/>
  <text class="btn-ghost-text" x="722" y="418">Annulla</text>
  <rect class="btn-primary-disabled" x="820" y="396" width="140" height="34" rx="6"/>
  <text class="btn-primary-text" x="834" y="418" fill="#4c5bd4">Pubblica (disabilitato)</text>
  <text class="subtitle" x="700" y="444">Il pulsante "Pubblica" si abilita solo dopo la spunta di conferma</text>
  <text class="subtitle" x="700" y="458">e con zero errori bloccanti (gli avvisi non bloccano, §14).</text>

  <text x="24" y="540" fill="#9aa3af" font-size="10" font-style="italic">Wireframe illustrativo — non design finale [P]</text>
</svg>
