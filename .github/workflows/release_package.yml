name: Package Full Release

#on:
#  release:
#    types: [created]

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout including submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Create release archive
        run: |
          zip -r "YSocial-full.zip" . \
            -x ".git/*" ".github/*" "*.gitignore" \
            -x "*/.git/*"

      - name: Keep the ZIP as a workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: YSocial-full
          path: YSocial-full.zip

      - name: Upload release ZIP
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./YSocial-full.zip
          asset_name: YSocial-full.zip
          asset_content_type: application/zip
