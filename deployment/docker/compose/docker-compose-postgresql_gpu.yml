services:
  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - ysocial
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - my-network
    ports:
      - 80:80

  ysocial:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ysocial
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../..:/app/
    environment:
      - FLASK_APP=/app/y_social.py
      - YSOCIAL_SECRET_KEY=${YSOCIAL_SECRET_KEY:-}
      # read by y_web/db_init/postgresql.py
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=${PG_PASSWORD:-password}
      - PG_DBNAME=dashboard
      - PG_DBNAME_DUMMY=dummy
      - NVIDIA_VISIBLE_DEVICES=all
      # - LLM_BACKEND=ollama  # Default: None. Options: ollama, vllm
    networks:
      my-network:
        aliases:
          - ysocial
    ports:
      - 5001:5000  # Host port 5001 -> Container port 5000

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
    runtime: nvidia

    command: python /app/y_social.py --host 0.0.0.0 --port 5000 --db postgresql --llm-backend ollama

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      # the postgres image refuses to start without POSTGRES_PASSWORD
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
    networks:
      - my-network
    ports:
      - 5432:5432  # Optional: expose port for local debugging

volumes:
  pgdata:

networks:
  my-network:
