<aside
    id="ys-chat-panel"
    class="ys-chat-panel is-collapsed"
    data-exp-id="{{ exp_id }}"
    data-page-kind="{{ chat_page_kind|default('feed', true) }}"
>
    <button
        id="ys-chat-collapse-handle"
        type="button"
        class="ys-chat-collapse-handle"
        aria-expanded="false"
        aria-controls="ys-chat-card"
        title="{{ _('Toggle chat panel') }}"
    >
        <i data-feather="message-circle"></i>
        <span
            id="ys-chat-collapse-badge"
            class="ys-chat-collapse-badge is-hidden"
            aria-hidden="true"
        ></span>
    </button>

        <div id="ys-chat-card" class="ys-chat-card">
        <div class="ys-chat-card-header">
            <div>
                <div class="ys-chat-title">{{ _('Chat') }}</div>
                <div class="ys-chat-subtitle">{{ _('Private chats with followed agents') }}</div>
            </div>
            <div class="ys-chat-header-actions">
                <button id="ys-chat-refresh" type="button" class="ys-chat-icon-btn" title="{{ _('Refresh') }}">
                    <i data-feather="refresh-cw"></i>
                </button>
                <button id="ys-chat-collapse" type="button" class="ys-chat-icon-btn" title="{{ _('Collapse') }}">
                    <i data-feather="chevron-right"></i>
                </button>
            </div>
        </div>

        <div id="ys-chat-browser" class="ys-chat-browser">
            <div class="ys-chat-search-row">
                <input
                    id="ys-chat-search"
                    type="search"
                    class="input ys-chat-search-input"
                    placeholder="{{ _('Search followed agents') }}"
                />
            </div>
            <div id="ys-chat-list" class="ys-chat-list"></div>
        </div>

        <div id="ys-chat-thread" class="ys-chat-thread is-hidden">
            <div class="ys-chat-thread-head">
                <button id="ys-chat-back" type="button" class="ys-chat-icon-btn" title="{{ _('Back') }}">
                    <i data-feather="arrow-left"></i>
                </button>
                <div class="ys-chat-thread-target">
                    <div id="ys-chat-target-avatar" class="ys-chat-thread-avatar"></div>
                    <div class="ys-chat-thread-meta">
                        <div id="ys-chat-target-name" class="ys-chat-thread-name">{{ _('Agent') }}</div>
                        <div id="ys-chat-target-subtitle" class="ys-chat-thread-subtitle">{{ _('Private chat') }}</div>
                    </div>
                </div>
            </div>

            <div id="ys-chat-messages" class="ys-chat-messages"></div>

            <form id="ys-chat-compose" class="ys-chat-compose">
                <textarea
                    id="ys-chat-input"
                    class="textarea ys-chat-input"
                    rows="2"
                    placeholder="{{ _('Write a message...') }}"
                ></textarea>
                <button id="ys-chat-send" type="submit" class="ys-chat-send-btn">
                    <i data-feather="send"></i>
                    <span>{{ _('Send') }}</span>
                </button>
            </form>
        </div>
    </div>
</aside>
