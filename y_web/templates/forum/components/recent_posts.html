{# Right column of the feed: threads the user opened recently (kept in the browser, per experiment) #}
<section class="fr-aside-card fr-recent" id="fr-recent" data-exp-id="{{ exp_id }}" hidden>
    <header class="fr-recent-head">
        <h3>{{ _('Recent posts') }}</h3>
        <button type="button" class="fr-recent-clear" data-fr-recent-clear>{{ _('Clear') }}</button>
    </header>
    <ol class="fr-recent-list" id="fr-recent-list"></ol>
</section>
